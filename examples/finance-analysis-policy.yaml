# Analysis-only CHP policy used by FinanceAnalysisGate.
# Notional is zero (no capital movement). HITL threshold is zero so every
# commentary draft requires an assigned human reviewer.
version: "finance-analysis-1.0"
max_notional_usd: 0
daily_notional_cap_usd: 0
hitl_threshold_usd: 0
allowed_actions:
  - analyze
  - comment
per_asset_limits: {}
min_confidence: 0.7
allowed_assets:
  - pnl
  - balance-sheet
  - trial-balance
  - cash-flow
allowed_venues:
  - xero-export
  - accounting-export
